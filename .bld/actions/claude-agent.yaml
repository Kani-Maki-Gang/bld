version: 3
type: action

name: Run Claude Code against a worktree

# This action runs *inside* the caller job's container platform (see
# dev/implementation.yaml, whose `implement` job sets `runs_on` to the dev agent
# image with the worktree and ~/.claude bind-mounted). It therefore just invokes
# the `claude` CLI directly - the container tooling and volume mounts are provided
# by the job, not by this action.

inputs:
  worktree_dir:
    type: text
    description: Absolute path to the git worktree Claude Code works in (bind-mounted into the job container at the same path)
    required: true
  model:
    type: text
    description: Full Claude model id, e.g. claude-opus-5-5 or claude-sonnet-5-5
    required: true
  effort:
    type: text
    description: Reasoning effort level (low, medium, high, xhigh, max)
    default: medium
    required: false
  prompt:
    type: text
    description: The prompt to send to Claude Code
    required: true
  permission_mode:
    type: text
    description: >-
      Claude Code --permission-mode value for this run. bypassPermissions is
      refused by the CLI when it runs as root, which is the case inside the dev
      agent container, so the default is acceptEdits combined with the explicit
      allowed_tools list below.
    default: acceptEdits
    required: false
  allowed_tools:
    type: text
    description: Comma separated list of tools pre-approved for the run, passed to --allowedTools
    default: Bash,Edit,Write,Read,Glob,Grep,TodoWrite
    required: false
  session_key:
    type: text
    description: >-
      Identifies an independent Claude session within the worktree (e.g.
      "implement" vs "review"). Two steps using different keys get separate
      sessions; reusing a key across runs resumes that session.
    required: true

steps:
  - id: prompt
    name: Write the prompt file
    working_dir: ${{ inputs.worktree_dir }}
    run: |
      set -euo pipefail

      # The prompt goes through a quoted heredoc so shell metacharacters in it
      # (e.g. the backticks around `gh issue view`) reach Claude Code verbatim
      # instead of being expanded by bash first.
      cat > ".bld_claude_prompt_${{ inputs.session_key }}.md" <<'BLD_CLAUDE_PROMPT_EOF'
      ${{ inputs.prompt }}
      BLD_CLAUDE_PROMPT_EOF

  - id: run
    name: Invoke Claude Code
    run: |
      set -euo pipefail
      BLD_OUTPUTS="$(realpath -m "$BLD_OUTPUTS")"
      cd "${{ inputs.worktree_dir }}"

      session_file=".bld_claude_session_${{ inputs.session_key }}"

      resume_args=()
      if [ -f "$session_file" ]; then
        resume_args=(--resume "$(cat "$session_file")")
      fi

      # The caller declares these so they can be supplied for headless runs, which
      # means they arrive empty when the run relies on the mounted ~/.claude login
      # instead. An empty value is worse than an absent one for the CLI, so drop it.
      [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN
      [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY

      # The exit code is captured instead of letting `set -e` abort here, so that a
      # failed run still gets its json result reported by the next steps.
      # Not `--bare`: that mode skips loading the stored login, so the CLI reports
      # "Not logged in" even with a perfectly good ~/.claude mounted.
      exit_code=0
      claude -p "$(cat ".bld_claude_prompt_${{ inputs.session_key }}.md")" \
        --model "${{ inputs.model }}" \
        --effort "${{ inputs.effort }}" \
        --permission-mode "${{ inputs.permission_mode }}" \
        --allowedTools "${{ inputs.allowed_tools }}" \
        --output-format json \
        "${resume_args[@]}" > ".bld_claude_result_${{ inputs.session_key }}.json" || exit_code=$?

      echo "exit_code=$exit_code" >> $BLD_OUTPUTS

  - id: report
    name: Report the agent output
    run: |
      set -euo pipefail
      BLD_OUTPUTS="$(realpath -m "$BLD_OUTPUTS")"
      cd "${{ inputs.worktree_dir }}"

      result_file=".bld_claude_result_${{ inputs.session_key }}.json"
      output_file=".bld_last_output_${{ inputs.session_key }}.md"

      if ! jq -e . "$result_file" > /dev/null 2>&1; then
        echo "Claude Code produced no parseable json (exit code ${{ steps.run.outputs.exit_code }}):"
        cat "$result_file"
        exit 1
      fi

      jq -r '.result' "$result_file" > "$output_file"
      echo "output_file=${{ inputs.worktree_dir }}/$output_file" >> $BLD_OUTPUTS

      echo "----- claude (${{ inputs.session_key }}) -----"
      cat "$output_file"
      echo "---------------------------------------------"

  - id: check
    name: Check the agent result and keep the session
    run: |
      set -euo pipefail
      BLD_OUTPUTS="$(realpath -m "$BLD_OUTPUTS")"
      cd "${{ inputs.worktree_dir }}"

      result_file=".bld_claude_result_${{ inputs.session_key }}.json"
      output_file=".bld_last_output_${{ inputs.session_key }}.md"
      session_file=".bld_claude_session_${{ inputs.session_key }}"

      # Fail the step when the CLI itself reported an error, so a failed run isn't
      # mistaken for a finished implementation by the steps that follow.
      if [ "${{ steps.run.outputs.exit_code }}" != "0" ] || [ "$(jq -r '.is_error' "$result_file")" = "true" ]; then
        # No session file on failure: a session that never got off the ground cannot
        # be resumed, and a stale id would make the next run fail on --resume.
        rm -f "$session_file"
        echo "Claude Code reported an error for the ${{ inputs.session_key }} run (exit code ${{ steps.run.outputs.exit_code }})."
        if grep -qi "not logged in" "$output_file"; then
          echo
          echo "Claude Code is not authenticated inside the container. Either log in on"
          echo "the host so the mounted config carries a valid login (run 'claude' and"
          echo "/login), or pass a headless credential to the run, e.g."
          echo "  bld run dev/implementation.yaml -e CLAUDE_CODE_OAUTH_TOKEN=\$(claude setup-token)"
        fi
        exit 1
      fi

      # Only a completed run leaves a resumable session behind.
      jq -r '.session_id' "$result_file" > "$session_file"
      echo "session_id=$(cat "$session_file")" >> $BLD_OUTPUTS

outputs:
  session_id:
    value: ${{ steps.check.outputs.session_id }}
    description: Id of the Claude Code session, which a later run with the same session_key resumes
  exit_code:
    value: ${{ steps.run.outputs.exit_code }}
    description: Exit code of the claude CLI
  output_file:
    value: ${{ steps.report.outputs.output_file }}
    description: Absolute path to the file that holds the final message of the agent
