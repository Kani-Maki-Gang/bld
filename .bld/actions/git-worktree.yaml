version: 3
type: action

name: Create a branch and git worktree for a GitHub project item

inputs:
  item:
    type: number
    description: GitHub issue/project item number to work on
    required: true
  worktree_root:
    type: text
    description: Directory under which per-item worktrees are created
    required: true
  repo_dir:
    type: text
    description: The main repository clone the worktree is created from
    required: true
  base_branch:
    type: text
    description: Branch the new item branch starts from
    default: master
    required: false

steps:
  - id: fetch
    name: Fetch the remote branches
    working_dir: ${{ inputs.repo_dir }}
    run: |
      set -euo pipefail
      mkdir -p "${{ inputs.worktree_root }}"
      git fetch origin

  - id: create
    name: Create branch and worktree for the item
    working_dir: ${{ inputs.repo_dir }}
    run: |
      set -euo pipefail

      branch="item-${{ inputs.item }}"
      worktree_dir="${{ inputs.worktree_root }}/item-${{ inputs.item }}"
      worktree_created=false
      branch_created=false

      if [ -d "$worktree_dir" ]; then
        echo "Worktree for item ${{ inputs.item }} already exists at $worktree_dir"
      elif git show-ref --verify --quiet "refs/heads/$branch"; then
        git worktree add "$worktree_dir" "$branch"
        worktree_created=true
      elif git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
        git worktree add "$worktree_dir" "$branch"
        worktree_created=true
        branch_created=true
      else
        git worktree add "$worktree_dir" -b "$branch" "origin/${{ inputs.base_branch }}"
        worktree_created=true
        branch_created=true
      fi

      echo "worktree_dir=$worktree_dir" >> $BLD_OUTPUTS
      echo "branch=$branch" >> $BLD_OUTPUTS
      echo "worktree_created=$worktree_created" >> $BLD_OUTPUTS
      echo "branch_created=$branch_created" >> $BLD_OUTPUTS
      echo "Worktree for item ${{ inputs.item }} ready at $worktree_dir on $branch (worktree created: $worktree_created, branch created: $branch_created)"

outputs:
  worktree_dir:
    value: ${{ steps.create.outputs.worktree_dir }}
    description: Absolute path to the item worktree
  branch:
    value: ${{ steps.create.outputs.branch }}
    description: Name of the item branch, item-<number>
  worktree_created:
    value: ${{ steps.create.outputs.worktree_created }}
    description: true when this run added the worktree, false when it existed before
  branch_created:
    value: ${{ steps.create.outputs.branch_created }}
    description: true when this run created the local branch, false when it existed before
