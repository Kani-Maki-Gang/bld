version: 2

name: Build and push container image to registry
runs_on: machine

variables:
  branch: master
  sha: ''
  registry: ''
  username: ''
  password: ''

environment:
  image_name: bld-dev-pipelines

jobs:
  main:
    - name: Clone repository
      exec:
        - echo 'Cloning repository on branch ${{ branch }}'
        - git clone -b ${{ branch }} https://github.com/Kani-Maki-Gang/bld.git

    - name: Login to registry
      exec:
        - docker login -u ${{ username }} -p ${{ password }} ${{ registry }}

    - name: Build and push image
      working_dir: bld
      exec:
        - docker build -t ${{ registry }}/bld-ci:${{ sha }} -t ${{ registry }}/bld-ci:latest -f ${{ bld_root_dir }}/dockerfiles/Dockerfile .
        - docker push ${{ registry }}/bld-ci:${{ sha }}
        - docker push ${{ registry }}/bld-ci:latest
