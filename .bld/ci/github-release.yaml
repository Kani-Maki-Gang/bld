name: Create GitHub Release
version: 2

runs_on: machine

variables:
  tag: ''
  branch: master
  token: ''
  prerelease: 'false'

jobs:
  main:
    - name: Create the release and the tag
      working_dir: ${{ bld_project_dir }}/dist
      exec:
        - |
          # jq makes the request body, because the "prerelease" field must be a JSON
          # boolean, but a bld variable is always a text value. Any value that is not
          # the text "true" becomes false.
          jq -n \
            --arg tag '${{ tag }}' \
            --arg branch '${{ branch }}' \
            --argjson prerelease "$([ '${{ prerelease }}' = 'true' ] && echo true || echo false)" \
            '{
              tag_name: $tag,
              target_commitish: $branch,
              name: "Release \($tag)",
              draft: false,
              prerelease: $prerelease,
              generate_release_notes: true
            }' > release_request.json
        - |
          # pipefail is needed, because jq is the last command of the pipe. Without it
          # a failed request stays hidden and release_id becomes an empty file.
          set -euo pipefail
          curl -s --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Kani-Maki-Gang/bld/releases \
            -d @release_request.json \
            | jq -r .id > release_id

    - name: Upload the release assets
      working_dir: ${{ bld_project_dir }}/dist
      exec:
        - |
          set -euo pipefail
          release_id=$(cat release_id)
          for asset in \
            bld-x86_64-unknown-linux-musl.tar.gz \
            SHA256-x86_64-unknown-linux-musl \
            bld-x86_64-pc-windows-gnu.zip \
            SHA256-x86_64-pc-windows-gnu
          do
            echo "Uploading $asset"
            curl -s --fail -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/Kani-Maki-Gang/bld/releases/$release_id/assets?name=$asset" \
              > /dev/null
          done
