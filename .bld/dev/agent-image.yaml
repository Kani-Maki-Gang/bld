version: 3
type: pipeline

name: Build, check and publish the dev agent image

inputs:
  tag:
    type: text
    description: Tag of the image
    default: latest
    required: false
  tools:
    type: array
    description: Commands that must run in the image. The smoke job runs each one with --version
    default: [claude, gh, cargo, rustfmt, cargo-clippy, jq, git]
    required: false
  registry:
    type: text
    description: Registry that the image is tagged for
    default: ghcr.io/kani-maki-gang
    required: false
  push:
    type: boolean
    description: When true, the publish job pushes the image to the registry
    default: false
    required: false

env:
  image_name: bld-dev-agent

jobs:
  smoke:
    runs_on:
      name: bld-dev-agent
      tag: ${{ inputs.tag }}
      dockerfile: ${{ bld_root_dir }}/images/Dockerfile.dev-agent
    strategy:
      fail_fast: true
      matrix:
        tool: ${{ inputs.tools }}
    steps:
      - id: version
        name: Run the tool in the image
        run: ${{ matrix.tool }} --version

  publish:
    runs_on: machine
    needs: smoke
    steps:
      - id: tag
        name: Tag the image for the registry
        run: |
          set -euo pipefail
          podman tag "${{ env.image_name }}:${{ inputs.tag }}" "${{ inputs.registry }}/${{ env.image_name }}:${{ inputs.tag }}"
          echo "Tagged ${{ inputs.registry }}/${{ env.image_name }}:${{ inputs.tag }}"

      - id: push
        name: Push the image to the registry
        if: ${{ inputs.push }}
        run: podman push "${{ inputs.registry }}/${{ env.image_name }}:${{ inputs.tag }}"
