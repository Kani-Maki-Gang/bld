version: 3
type: pipeline

name: Development workflow orchestrator

inputs:
  project_owner:
    description: Owner (org or user) of the GitHub project to query
    required: false
    default: Kani-Maki-Gang
  project_number:
    description: GitHub project number to query
    required: false
    default: "7"
  repo:
    description: Repository the project items are issues of, in owner/name form
    default: Kani-Maki-Gang/bld
    required: false
  repo_dir:
    description: The local clone of the repository on the current machine
    default: ${{ bld_project_dir }}
    required: false
  assignee:
    description: >-
      Only project items assigned to this GitHub login are picked up, and the pull
      requests opened for them are assigned to it. Defaults to @me, which the fetch
      step resolves to the login of the authenticated gh user.
    default: "@me"
    required: false
  status_field:
    description: Project field name holding the item's development status
    default: Status
    required: false
  ready_status_value:
    description: Field value that marks an item ready for development
    default: Ready
    required: false
  in_progress_status_value:
    description: Field value set on an item once its implementation run starts
    default: In progress
    required: false
  in_review_status_value:
    description: Field value set on an item once its pull request is open
    default: In review
    required: false
  worktree_root:
    description: >-
      Directory under which per-item git worktrees are created. Defaults to
      <project dir>/../worktrees/bld, resolved by the fetch step below - input
      defaults are used verbatim by the runner, so an expression cannot be put here.
    default: ""
    required: false

jobs:
  dispatch:
    runs_on: machine
    steps:
      - id: fetch
        name: Fetch items ready for development
        run: |
          set -euo pipefail

          # gh project item-list lowercases the field names in its json output, so the
          # field is matched in lowercase here while the item-edit steps below use the
          # input verbatim, which is the casing the GitHub API expects.
          field="$(echo "${{ inputs.status_field }}" | tr '[:upper:]' '[:lower:]')"
          value="${{ inputs.ready_status_value }}"

          # @me is resolved here rather than passed through, because the project item
          # json carries real logins and jq has nothing to compare an alias against.
          assignee="${{ inputs.assignee }}"
          if [ "$assignee" = "@me" ]; then
            assignee="$(gh api user -q .login)"
          fi

          if [ -z "$assignee" ]; then
            echo "Could not determine the assignee to filter on - pass -i assignee=<login>."
            exit 1
          fi

          # The assignee match is any(. == $assignee) rather than contains: on arrays of
          # strings contains does substring matching, so ["kostas-vl"] would match the
          # login "kostas".
          items="$(gh project item-list ${{ inputs.project_number }} --owner ${{ inputs.project_owner }} --format json --limit 200 \
            | jq -c --arg field "$field" --arg value "$value" --arg assignee "$assignee" \
                '[.items[]
                  | select((.[$field] // "") == $value)
                  | select((.assignees // []) | any(. == $assignee))
                  | (.content.number // empty)]')"

          # A matrix expression must resolve to a non-empty array (see
          # strategy/v3.rs), so fail with a clear message rather than a cryptic
          # matrix error when nothing is ready for development.
          if [ "$items" = "[]" ] || [ -z "$items" ]; then
            echo "No items in '${{ inputs.ready_status_value }}' status assigned to $assignee - nothing to implement."
            exit 1
          fi

          # Published for the commit step, which assigns the pull request to the same
          # login every item was filtered on.
          echo "assignee=$assignee" >> $BLD_OUTPUTS

          echo "items=$items" >> $BLD_OUTPUTS
          # Host paths bind-mounted into the implementation container so Claude Code
          # and the GitHub CLI are authenticated inside it.
          if [ -n "${CLAUDE_CONFIG_DIR:-}" ]; then
            claude_dir="$CLAUDE_CONFIG_DIR"
            claude_config_file="$CLAUDE_CONFIG_DIR/.claude.json"
          else
            claude_dir="$HOME/.claude"
            claude_config_file="$HOME/.claude.json"
          fi

          # Both paths are bind mount sources, so bail out instead of letting the
          # container engine create an empty directory in their place.
          for path in "$claude_dir" "$claude_config_file"; do
            if [ ! -e "$path" ]; then
              echo "Expected Claude Code path $path does not exist - run claude once on this machine first."
              exit 1
            fi
          done

          echo "claude_dir=$claude_dir" >> $BLD_OUTPUTS
          echo "claude_config_file=$claude_config_file" >> $BLD_OUTPUTS
          echo "gh_config_dir=${GH_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/gh}" >> $BLD_OUTPUTS

          # Resolved here rather than as an input default: defaults are taken
          # verbatim, so an expression in one would reach the shell unevaluated.
          worktree_root="${{ inputs.worktree_root }}"
          if [ -z "$worktree_root" ]; then
            worktree_root="${{ inputs.repo_dir }}/../worktrees/bld"
          fi
          worktree_root="$(realpath -m "$worktree_root")"
          echo "worktree_root=$worktree_root" >> $BLD_OUTPUTS
          echo "Worktrees under $worktree_root"

      - id: branch
        name: Create branch and worktree per item
        uses: actions/git-worktree.yaml
        strategy:
          fail_fast: false
          matrix:
            item: ${{ steps.fetch.outputs.items }}
        with:
          item: ${{ matrix.item }}
          worktree_root: ${{ steps.fetch.outputs.worktree_root }}
          repo_dir: ${{ inputs.repo_dir }}

      - id: issue
        name: Write each item's issue content and mark it in progress
        strategy:
          fail_fast: false
          matrix:
            item: ${{ steps.fetch.outputs.items }}
        working_dir: ${{ steps.fetch.outputs.worktree_root }}/item-${{ matrix.item }}
        run: |
          set -euo pipefail

          # The issue is fetched here, on the machine, rather than by the agents in
          # the container: the host keeps its GitHub token in the OS keyring, which
          # the mounted gh config directory does not carry, so gh is not
          # authenticated inside the container.
          gh issue view ${{ matrix.item }} --repo ${{ inputs.repo }} \
            --json number,title,body,labels,url \
            | jq -r '"# Issue #\(.number): \(.title)\n\nURL: \(.url)\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)"' \
            > .bld_issue.md

          echo "Item ${{ matrix.item }}: wrote $(wc -l < .bld_issue.md) lines of issue content to .bld_issue.md"

          # Moving the item out of Ready here, before the agents start, is what stops a
          # repeated or concurrent orchestrator run from picking the same item up again.
          # gh resolves the field and the value by name, so no node ids are needed.
          gh project item-edit ${{ inputs.project_number }} \
            --owner ${{ inputs.project_owner }} \
            --url https://github.com/${{ inputs.repo }}/issues/${{ matrix.item }} \
            --field "${{ inputs.status_field }}" \
            --value "${{ inputs.in_progress_status_value }}"

          echo "Item ${{ matrix.item }}: status set to ${{ inputs.in_progress_status_value }}"

      - id: implement
        name: Run the implementation pipeline per item
        uses: dev/implementation.yaml
        strategy:
          fail_fast: false
          matrix:
            item: ${{ steps.fetch.outputs.items }}
        with:
          item: ${{ matrix.item }}
          branch: item-${{ matrix.item }}
          worktree_dir: ${{ steps.fetch.outputs.worktree_root }}/item-${{ matrix.item }}
          repo_dir: ${{ inputs.repo_dir }}
          claude_dir: ${{ steps.fetch.outputs.claude_dir }}
          claude_config_file: ${{ steps.fetch.outputs.claude_config_file }}
          gh_config_dir: ${{ steps.fetch.outputs.gh_config_dir }}

      - id: commit
        name: Commit, push and open a pull request for each item
        strategy:
          fail_fast: false
          matrix:
            item: ${{ steps.fetch.outputs.items }}
        working_dir: ${{ steps.fetch.outputs.worktree_root }}/item-${{ matrix.item }}
        run: |
          set -euo pipefail

          status_file=".bld_review_status"
          msg_file=".bld_commit_msg"
          body_file=".bld_pr_body.md"
          branch="item-${{ matrix.item }}"

          if [ ! -f "$status_file" ] || ! grep -q '^OK' "$status_file"; then
            echo "Item ${{ matrix.item }}: review did not confirm OK, skipping commit."
            echo "Review status:"
            cat "$status_file" 2>/dev/null || echo "(no .bld_review_status file found)"
            echo "The item stays in ${{ inputs.in_progress_status_value }} for an engineer to pick up."
            exit 0
          fi

          # Exclude bld's own worktree helper files (.bld_claude_session_*,
          # .bld_last_output_*.md, .bld_review_status, .bld_commit_msg,
          # .bld_pr_body.md) from the commit.
          git add -A -- . ':!.bld_*'
          if git diff --cached --quiet; then
            echo "Item ${{ matrix.item }}: no changes to commit."
            exit 0
          fi

          # The review agent writes the conventional commit message, since it is the
          # step that sees the final diff. Fall back to a generic message rather than
          # failing the item when it did not write one.
          if [ ! -s "$msg_file" ]; then
            echo "chore: implement item ${{ matrix.item }}" > "$msg_file"
          fi

          git commit -F "$msg_file"
          git push -u origin "$branch"

          # gh pr create fails when a pull request for the branch already exists, which
          # is the normal case on a re-run, so reuse the open one instead. No --base is
          # needed: it defaults to the repository's default branch, which is what
          # actions/git-worktree.yaml branched from.
          pr_url="$(gh pr list --repo ${{ inputs.repo }} --head "$branch" --state open --json url -q '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            # The review agent writes the "### In this PR" body; fall back to a single
            # bullet with the commit subject when it did not. Any Closes line is
            # stripped first so a re-run cannot append a second one. The body is held
            # in a variable because redirecting into the file being read truncates it.
            if [ -s "$body_file" ]; then
              body="$(grep -v '^Closes #' "$body_file" || true)"
            fi
            if [ -z "${body:-}" ]; then
              body="$(printf '### In this PR\n\n- %s' "$(head -n 1 "$msg_file")")"
            fi
            printf '%s\n\nCloses #%s\n' "$body" "${{ matrix.item }}" > "$body_file"

            pr_url="$(gh pr create --repo ${{ inputs.repo }} --head "$branch" \
              --assignee "${{ steps.fetch.outputs.assignee }}" \
              --title "$(head -n 1 "$msg_file")" \
              --body-file "$body_file")"
          fi

          gh project item-edit ${{ inputs.project_number }} \
            --owner ${{ inputs.project_owner }} \
            --url https://github.com/${{ inputs.repo }}/issues/${{ matrix.item }} \
            --field "${{ inputs.status_field }}" \
            --value "${{ inputs.in_review_status_value }}"

          echo "Item ${{ matrix.item }}: $pr_url"
          echo "Item ${{ matrix.item }}: status set to ${{ inputs.in_review_status_value }}"

      - id: cleanup
        name: Remove the worktree of each item that reached review
        strategy:
          fail_fast: false
          matrix:
            item: ${{ steps.fetch.outputs.items }}
        # git worktree remove cannot run from inside the worktree it removes, so this
        # step works from the main clone instead of the per item worktree.
        working_dir: ${{ inputs.repo_dir }}
        run: |
          set -euo pipefail

          worktree_dir="${{ steps.fetch.outputs.worktree_root }}/item-${{ matrix.item }}"

          if [ ! -d "$worktree_dir" ]; then
            echo "Item ${{ matrix.item }}: no worktree at $worktree_dir, nothing to clean up."
            exit 0
          fi

          # The board is the source of truth for whether the item finished: the commit
          # step only reaches In review once the push and the pull request succeeded.
          # Anything left In progress keeps its worktree, which is what an engineer goes
          # into to see what went wrong.
          field="$(echo "${{ inputs.status_field }}" | tr '[:upper:]' '[:lower:]')"
          status="$(gh project item-list ${{ inputs.project_number }} --owner ${{ inputs.project_owner }} --format json --limit 200 \
            | jq -r --arg field "$field" --argjson item ${{ matrix.item }} \
                '.items[] | select((.content.number // empty) == $item) | (.[$field] // "")')"

          if [ "$status" != "${{ inputs.in_review_status_value }}" ]; then
            echo "Item ${{ matrix.item }}: status is '${status:-unknown}', keeping $worktree_dir to inspect."
            exit 0
          fi

          # Refuse to throw away real work. Only the pipeline's own .bld_ scratch files
          # may be left behind, and every commit must already be on the remote.
          if [ -n "$(git -C "$worktree_dir" status --porcelain -- . ':!.bld_*')" ]; then
            echo "Item ${{ matrix.item }}: uncommitted changes in $worktree_dir, keeping it."
            git -C "$worktree_dir" status --short -- . ':!.bld_*'
            exit 0
          fi

          # A branch with no upstream has never been pushed, so treat a missing upstream
          # as unpushed work rather than as an empty diff.
          if ! upstream="$(git -C "$worktree_dir" rev-parse --abbrev-ref '@{u}' 2>/dev/null)"; then
            echo "Item ${{ matrix.item }}: branch has no upstream, keeping $worktree_dir."
            exit 0
          fi

          if [ -n "$(git -C "$worktree_dir" log --oneline "$upstream..HEAD")" ]; then
            echo "Item ${{ matrix.item }}: unpushed commits in $worktree_dir, keeping it."
            exit 0
          fi

          # --force is needed only because the .bld_ scratch files are untracked; the
          # checks above already established there is nothing of value left here.
          git worktree remove --force "$worktree_dir"

          echo "Item ${{ matrix.item }}: removed $worktree_dir."
          echo "Item ${{ matrix.item }}: branch item-${{ matrix.item }} is kept, the pull request is open on it."
