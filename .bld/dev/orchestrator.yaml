version: 3
type: pipeline

name: Development workflow orchestrator

inputs:
  project_owner:
    type: text
    description: Owner (org or user) of the GitHub project to query
    required: false
    default: Kani-Maki-Gang
  project_number:
    type: number
    description: GitHub project number to query
    required: false
    default: 7
  repo:
    type: text
    description: Repository the project items are issues of, in owner/name form
    default: Kani-Maki-Gang/bld
    required: false
  repo_dir:
    type: text
    description: >-
      The local clone of the repository on the current machine. A linked worktree
      of the clone is also accepted, the discover job resolves the main clone from it.
    default: ${{ bld_project_dir }}
    required: false
  assignee:
    type: text
    description: >-
      Only project items assigned to this GitHub login are picked up, and the pull
      requests opened for them are assigned to it. Defaults to @me, which the
      discover job resolves to the login of the authenticated gh user.
    default: "@me"
    required: false
  items:
    type: array
    description: >-
      Issue numbers to implement. When the list is not empty, the run uses it and
      does not query the project board for ready items.
    default: []
    required: false
  status_field:
    type: text
    description: Project field name holding the item's development status
    default: Status
    required: false
  ready_status_value:
    type: text
    description: Field value that marks an item ready for development
    default: Ready
    required: false
  in_progress_status_value:
    type: text
    description: Field value set on an item once its implementation run starts
    default: In progress
    required: false
  in_review_status_value:
    type: text
    description: Field value set on an item once its pull request is open
    default: In review
    required: false
  worktree_root:
    type: text
    description: >-
      Directory under which per-item git worktrees are created. When empty, the
      discover job uses <repo_dir>/../worktrees/bld.
    default: ""
    required: false
  dry_run:
    type: boolean
    description: When true, each item is implemented and reviewed, but nothing is pushed, no pull request is opened and no project status changes
    default: false
    required: false
  fail_fast:
    type: boolean
    description: When true, the first item that fails stops the items that did not start yet
    default: false
    required: false

jobs:
  discover:
    runs_on: machine
    steps:
      - id: assignee
        name: Resolve the assignee
        run: |
          set -euo pipefail

          # @me is resolved here rather than passed through, because the project item
          # json carries real logins and jq has nothing to compare an alias against.
          assignee="${{ inputs.assignee }}"
          if [ "$assignee" = "@me" ]; then
            assignee="$(gh api user -q .login)"
          fi

          if [ -z "$assignee" ]; then
            echo "Could not determine the assignee to filter on. Pass -i assignee=<login>."
            exit 1
          fi

          echo "login=$assignee" >> $BLD_OUTPUTS
          echo "Assignee: $assignee"

      - id: repo
        name: Resolve the main clone of the repository
        run: |
          set -euo pipefail

          common_dir="$(git -C "${{ inputs.repo_dir }}" rev-parse --path-format=absolute --git-common-dir)"
          repo_dir="$(dirname "$common_dir")"

          echo "path=$repo_dir" >> $BLD_OUTPUTS
          echo "Main clone: $repo_dir"

      - id: items
        name: Select the items to implement
        run: |
          set -euo pipefail

          items="$(jq -c '[.[] | tonumber]' <<< '${{ inputs.items }}')"

          if [ "$items" = "[]" ]; then
            # gh project item-list lowercases the field names in its json output, so the
            # field is matched in lowercase here while actions/gh-project-status.yaml uses
            # the input verbatim, which is the casing the GitHub API expects.
            field="$(echo "${{ inputs.status_field }}" | tr '[:upper:]' '[:lower:]')"

            # The assignee match is any(. == $assignee) rather than contains: on arrays of
            # strings contains does substring matching, so ["kostas-vl"] would match the
            # login "kostas".
            items="$(gh project item-list ${{ inputs.project_number }} --owner ${{ inputs.project_owner }} --format json --limit 200 \
              | jq -c --arg field "$field" --arg value "${{ inputs.ready_status_value }}" --arg assignee "${{ steps.assignee.outputs.login }}" \
                  '[.items[]
                    | select((.[$field] // "") == $value)
                    | select((.assignees // []) | any(. == $assignee))
                    | (.content.number // empty)]')"
            echo "Items from the board: $items"
          else
            echo "Items from the input: $items"
          fi

          count="$(jq length <<< "$items")"
          if [ "$count" = "0" ]; then
            echo "No items in '${{ inputs.ready_status_value }}' status assigned to ${{ steps.assignee.outputs.login }}. Nothing to implement."
            exit 1
          fi

          echo "list=$items" >> $BLD_OUTPUTS
          echo "count=$count" >> $BLD_OUTPUTS

      - id: paths
        name: Resolve the Claude Code and gh paths
        uses: actions/claude-host-paths.yaml

      - id: worktree_root
        name: Resolve the worktree root
        run: |
          set -euo pipefail

          worktree_root="${{ inputs.worktree_root }}"
          if [ -z "$worktree_root" ]; then
            worktree_root="${{ steps.repo.outputs.path }}/../worktrees/bld"
          fi
          worktree_root="$(realpath -m "$worktree_root")"

          echo "path=$worktree_root" >> $BLD_OUTPUTS
          echo "Worktrees under $worktree_root"

    outputs:
      items:
        value: ${{ steps.items.outputs.list }}
        description: JSON array of the issue numbers to implement
      count:
        value: ${{ steps.items.outputs.count }}
        description: Number of issues to implement
      assignee:
        value: ${{ steps.assignee.outputs.login }}
        description: GitHub login that the items are assigned to
      repo_dir:
        value: ${{ steps.repo.outputs.path }}
        description: Absolute path to the main clone of the repository
      worktree_root:
        value: ${{ steps.worktree_root.outputs.path }}
        description: Absolute directory under which the item worktrees are created
      claude_dir:
        value: ${{ steps.paths.outputs.claude_dir }}
        description: Absolute host path to the Claude Code config directory
      claude_config_file:
        value: ${{ steps.paths.outputs.claude_config_file }}
        description: Absolute host path to the Claude Code account file
      gh_config_dir:
        value: ${{ steps.paths.outputs.gh_config_dir }}
        description: Absolute host path to the GitHub CLI config directory

  dispatch:
    runs_on: machine
    needs: discover
    steps:
      - id: item
        name: Implement, review and open a pull request per item
        uses: actions/dev-item.yaml
        strategy:
          fail_fast: ${{ inputs.fail_fast }}
          matrix:
            item: ${{ jobs.discover.outputs.items }}
        env:
          GIT_TERMINAL_PROMPT: "0"
        with:
          item: ${{ matrix.item }}
          dry_run: ${{ inputs.dry_run }}
          repo: ${{ inputs.repo }}
          repo_dir: ${{ jobs.discover.outputs.repo_dir }}
          worktree_root: ${{ jobs.discover.outputs.worktree_root }}
          assignee: ${{ jobs.discover.outputs.assignee }}
          project_owner: ${{ inputs.project_owner }}
          project_number: ${{ inputs.project_number }}
          status_field: ${{ inputs.status_field }}
          in_progress_status_value: ${{ inputs.in_progress_status_value }}
          in_review_status_value: ${{ inputs.in_review_status_value }}
          claude_dir: ${{ jobs.discover.outputs.claude_dir }}
          claude_config_file: ${{ jobs.discover.outputs.claude_config_file }}
          gh_config_dir: ${{ jobs.discover.outputs.gh_config_dir }}
