version: 3
type: pipeline

name: Ticket discovery

inputs:
  ticket_file:
    description: Path to a file with the raw requirements for a new feature
    required: true

jobs:
  discover:
    runs_on: machine
    steps:
      - id: discover
        name: Review requirements and draft the ticket
        working_dir: ${{ bld_project_dir }}
        run: |
          set -euo pipefail

          slug="$(basename "${{ inputs.ticket_file }}" | sed -E 's/\.[^.]+$//')"
          ticket_path="${slug}.md"

          claude --bare -p "Review the requirements in the attached file and \
          produce a complete, well-structured markdown ticket for it, \
          suitable for adding to a GitHub project: a short title, a \
          description, acceptance criteria, and any open questions. \
          Requirements:

          $(cat "${{ inputs.ticket_file }}")" \
            --model claude-opus-4-8 \
            --effort high \
            --output-format json > /tmp/ticket-discovery-result.json

          jq -r '.result' /tmp/ticket-discovery-result.json > "$ticket_path"
          rm -f /tmp/ticket-discovery-result.json

          echo "ticket_path=$ticket_path" >> $BLD_OUTPUTS

      - id: publish
        upload: ${{ steps.discover.outputs.ticket_path }}
        name: ticket
